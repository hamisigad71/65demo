<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <!-- Dark background circle -->
  <circle cx="50" cy="50" r="50" fill="#0f0f0f"/>
  <!-- Outer gold diamond -->
  <polygon points="50,6 94,50 50,94 6,50" fill="none" stroke="#ECC246" stroke-width="3"/>
  <!-- Inner gold diamond accent -->
  <polygon points="50,14 86,50 50,86 14,50" fill="none" stroke="#ECC246" stroke-width="1.5" opacity="0.6"/>
  <!-- EH monogram -->
  <text
    x="50"
    y="62"
    text-anchor="middle"
    fill="#ECC246"
    font-family="Georgia, serif"
    font-size="34"
    font-weight="700"
    letter-spacing="1"
  >EH</text>
</svg>